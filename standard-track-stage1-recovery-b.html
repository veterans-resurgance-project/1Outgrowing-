<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTI - Standard Recovery: Technical Data</title>
    <style>
        :root { --bg-color:#0f172a; --card-bg:#1e293b; --text-color:#f8fafc; --primary:#27ae60; --hud-bg:#144d29; --warning:#f59e0b; }
        body { font-family:system-ui, sans-serif; background:var(--bg-color); color:var(--text-color); padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .container { width:100%; max-width:800px; background:var(--card-bg); border-radius:14px; padding:35px; border:1px solid rgba(255,255,255,0.1); box-shadow:0 12px 32px rgba(0,0,0,0.5); }
        .hud-bar { background:var(--hud-bg); border-radius:8px; padding:10px 18px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:0.9rem; }
        .task-label { background:#0f172a; padding:20px; border-radius:10px; border:1px solid #334155; display:flex; align-items:flex-start; gap:15px; cursor:pointer; margin-bottom:15px; }
        .task-cb { margin-top:4px; transform:scale(1.3); accent-color:var(--primary); }
        .bridge-box { background:rgba(39,174,96,0.1); border:1px solid rgba(39,174,96,0.4); padding:25px; border-radius:12px; text-align:center; display:none; }
    </style>
</head>
<body>
<div class="container">
    <!-- HUD WITH INTEGRATED PORTAL ESCAPE HATCH -->
    <div class="hud-bar">
        <span>Path: <span style="color:var(--warning);">Standard Bootstrap</span></span>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div>Global XP: <span id="global-points" style="color:#4ade80;">425</span></div>
            <button onclick="window.location.href='index.html'" style="background:#334155; color:#fff; border:1px solid rgba(255,255,255,0.2); padding:5px 12px; border-radius:6px; font-size:0.75rem; font-weight:bold; cursor:pointer;">🏠 Exit to Portal</button>
        </div>
    </div>
    <div>
        <h2 style="margin:0 0 1.5rem 0; color:var(--warning);">⚠️ Data Recovery: Aligning with Regional Science</h2>
        <p style="line-height:1.6; color:#cbd5e1; margin-bottom:25px;">Chasing generalized web trends left you without local soil metrics. Check both boxes to correct your data footing.</p>
        <div style="margin-bottom:25px;">
            <label class="task-label"><input type="checkbox" class="task-cb" onchange="checkProg(this, 50)"><div><strong>Download Willamette Valley WebSoil Survey Reports (+50 XP)</strong><div style="color:#cbd5e1; font-size:0.9rem;">Map your target region's drainage classes and clay profiles using NRCS mapping data.</div></div></label>
            <label class="task-label"><input type="checkbox" class="task-cb" onchange="checkProg(this, 25)"><div><strong>Complete Extension Chemical Safety Webinar (+25 XP)</strong><div style="color:#cbd5e1; font-size:0.9rem;">Log a certified safety certificate on agricultural pesticide run-off protocols.</div></div></label>
        </div>
        <div id="bridge-panel" class="bridge-box">
            <h3 style="color:#4ade80; margin-top:0;">Technical Competence Logged</h3>
            <button onclick="window.location.href='standard-track-stage2-budgeting.html'" style="background:var(--primary); color:#fff; font-weight:bold; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; margin-top:10px;">Proceed to Stage 2: Financial Budgeting &rarr;</button>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => { document.getElementById('global-points').innerText = localStorage.getItem('afti_global_xp') || '425'; });
    function checkProg(cb, points) {
        let currentXP = parseInt(localStorage.getItem('afti_global_xp') || '425', 10) + (cb.checked ? points : -points);
        localStorage.setItem('afti_global_xp', currentXP); document.getElementById('global-points').innerText = currentXP;
        const cbs = document.querySelectorAll('.task-cb'); const all = Array.from(cbs).every(c => c.checked);
        document.getElementById('bridge-panel').style.display = all ? 'block' : 'none';
    }
</script>
</body>
</html>
