<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTI - Stage 3: Transitional Housing</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --txt:#f8fafc; --primary:#27ae60; --hud:#144d29; --accent:#38bdf8; --warn:#f59e0b; --danger:#ef4444; }
        body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .container { width:100%; max-width:800px; background:var(--card); border-radius:14px; padding:35px; box-sizing:border-box; border:1px solid rgba(255,255,255,0.1); box-shadow:0 12px 32px rgba(0,0,0,0.5); }
        .hud-bar { background:var(--hud); border-radius:8px; padding:10px 18px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:0.9rem; }
        .choices-container { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
        .choice-btn { background:#0f172a; border:1px solid #334155; color:#f8fafc; padding:16px 20px; border-radius:8px; cursor:pointer; width:100%; text-align:left; display:flex; flex-direction:column; gap:5px; }
        .choice-btn:hover { border-color:var(--accent); background:rgba(56,189,248,0.05); }
        .feedback-box { margin-top:25px; padding:20px; border-radius:8px; display:none; line-height:1.6; border:1px solid rgba(255,255,255,0.2); }
        .nav-bridge { display:inline-block; margin-top:15px; background:var(--primary); color:#fff; padding:12px 24px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="hud-bar">
        <span>Path: <span style="color:var(--accent);">Foster-Alum Track</span></span>
        <div style="display:flex; align-items:center; gap:20px;"><div>Global XP: <span id="global-points" style="color:#4ade80;">400</span></div><button onclick="window.location.href='index.html'" style="background:#334155; color:#fff; border:1px solid rgba(255,255,255,0.2); padding:5px 12px; border-radius:6px; font-size:0.75rem; cursor:pointer;">🏠 Exit</button></div>
    </div>
    <div>
        <h2 style="margin:0 0 1rem 0;">🏠 Stage 3: Transitional Housing &amp; Land Mapping</h2>
        <p style="line-height:1.7; color:#cbd5e1;">You have communications sorted. Now you meet with an advisor to secure a stable address. You cannot effectively tend soil if your sleeping arrangement shifts every single night. What do you do?</p>
        <div class="choices-container" id="choices-wrapper">
            <button class="choice-btn" onclick="selectOption('A', 100)"><span style="font-weight:bold; color:#4ade80;">Choice A: Apply for a subsidized transitional tiny-home voucher.</span><span style="font-size:0.85rem; color:#94a3b8;">Lock down placement option that includes a legal mailing address. (+100 XP)</span></button>
            <button class="choice-btn" onclick="selectOption('B', 25)"><span style="font-weight:bold; color:var(--warn);">Choice B: Accept a couch-surfing offer from an unverified acquaintance.</span><span style="font-size:0.85rem; color:#94a3b8;">Bypass wait times to focus day hours entirely on hunting raw land. (+25 XP)</span></button>
            <button class="choice-btn" onclick="selectOption('C', 0)"><span style="font-weight:bold; color:var(--danger);">Choice C: Pitch a stealth tent in a public park next to an irrigation canal.</span><span style="font-size:0.85rem; color:#94a3b8;">Avoid administrative networks entirely to camp out by water assets. (+0 XP)</span></button>
        </div>
        <div id="feedback-viewport" class="feedback-box">
            <h3 id="feedback-title" style="margin-top:0;"></h3>
            <p id="feedback-text"></p>
            <div id="feedback-action-container"></div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => { document.getElementById('global-points').innerText = localStorage.getItem('afti_global_xp') || '400'; });
    function selectOption(choiceType, points) {
        let currentXP = (parseInt(localStorage.getItem('afti_global_xp') || '400', 10)) + points;
        localStorage.setItem('afti_global_xp', currentXP); document.getElementById('global-points').innerText = currentXP;
        document.getElementById('choices-wrapper').style.display = 'none';
        const vp = document.getElementById('feedback-viewport'); const title = document.getElementById('feedback-title');
        const text = document.getElementById('feedback-text'); const ac = document.getElementById('feedback-action-container'); vp.style.display = 'block';
        if (choiceType === 'A') {
            vp.style.backgroundColor = 'rgba(39,174,96,0.1)'; title.innerText = "Success (+100 XP)"; title.style.color = "#4ade80";
            text.innerText = "Voucher accepted. You move into a tiny home with a locking door and legal address. Physiological safety is a prerequisite for agricultural development.";
            ac.innerHTML = '<button onclick="window.location.href=\'difficult-track-stage4-vocational.html\'" class="nav-bridge">Proceed to Stage 4: Vocational Practicum &rarr;</button>';
        } else if (choiceType === 'B') {
            vp.style.backgroundColor = 'rgba(245,158,11,0.1)'; title.innerText = "Misinformed Pivot (+25 XP)"; title.style.color = 'var(--warn)';
            text.innerText = "Landlord discovers you and enforces 'no guests'. You are displaced with zero notice. Couch-surfing leaves your portfolio parameters unstable.";
            ac.innerHTML = '<button onclick="window.location.href=\'difficult-track-stage3-recovery-b.html\'" class="nav-bridge" style="background:var(--warn);">Enter Housing Recovery Loop &rarr;</button>';
        } else {
            vp.style.backgroundColor = 'rgba(239,68,68,0.1)'; title.innerText = "Critical Risk (+0 XP)"; title.style.color = 'var(--danger)';
            text.innerText = "Code enforcement sweeps the park. Camp is cleared and you receive a trespass citation. Citations block background clearance check approvals.";
            ac.innerHTML = '<button onclick="window.location.href=\'difficult-track-stage3-recovery-c.html\'" class="nav-bridge" style="background:var(--danger);">Enter Citation Resolution Loop &rarr;</button>';
        }
    }
</script>
</body>
</html>
