<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTI - Stage 3: Transitional Housing</title>
    <style>
        :root { --bg-color:#0f172a; --card-bg:#1e293b; --text-color:#f8fafc; --primary:#27ae60; --hud-bg:#144d29; --accent:#38bdf8; --warning:#f59e0b; --danger:#ef4444; }
        body { font-family:system-ui, sans-serif; background:var(--bg-color); color:var(--text-color); padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .container { width:100%; max-width:800px; background:var(--card-bg); border-radius:14px; padding:35px; box-sizing:border-box; border:1px solid rgba(255,255,255,0.1); box-shadow:0 12px 32px rgba(0,0,0,0.5); }
        .hud-bar { background:var(--hud-bg); border-radius:8px; padding:10px 18px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; border:1px solid rgba(255,255,255,0.2); font-size:0.9rem; }
        .prose-block { line-height:1.7; color:#cbd5e1; margin-bottom:25px; font-size:1.05rem; }
        .choices-container { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
        .choice-btn { background:#0f172a; border:1px solid #334155; color:#f8fafc; padding:16px 20px; border-radius:8px; cursor:pointer; width:100%; text-align:left; display:flex; flex-direction:column; gap:5px; transition:all 0.2s ease; }
        .choice-btn:hover { border-color:var(--accent); background:rgba(56,189,248,0.05); transform:translateY(-2px); }
        .choice-title { font-weight:bold; color:#f8fafc; font-size:1.05rem; }
        .choice-desc { font-size:0.85rem; color:#94a3b8; }
        .feedback-box { margin-top:25px; padding:20px; border-radius:8px; display:none; line-height:1.6; }
        .feedback-explanation { font-size:0.95rem; margin-top:10px; color:#e2e8f0; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); }
        .nav-bridge { display:inline-block; margin-top:15px; background:var(--primary); color:#fff; text-decoration:none; padding:12px 24px; border-radius:6px; font-weight:bold; }
    </style>
</head>
<body>
        <!-- UPDATED GLOBAL HUD WITH RETURN PORTAL ACCELERATOR -->
    <div class="hud-bar">
        <span>Path: <span style="color: var(--accent);">Active Track</span></span>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span>Global XP: <span id="global-points" style="color: #4ade80;">400</span></span>
            
            <!-- THE ESCAPE HATCH BUTTON -->
            <button onclick="window.location.href='index.html'" style="background: #334155; color: #f8fafc; border: 1px solid rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: background 0.2s;">
                🏠 Exit to Portal
            </button>
        </div>
    </div>
    
        <h2 style="margin:0 0 1.5rem 0; font-size:1.4rem;">🏠 Stage 3: Transitional Housing &amp; Land Mapping</h2>
        <div class="prose-block">
            <p>You have communications sorted. Now you meet with an advisor to secure an address. You cannot effectively tend soil if your sleeping arrangement shifts every single night. What do you do?</p>
        </div>
        <div class="choices-container" id="choices-wrapper">
            <button class="choice-btn" onclick="selectHousingOption('A', 100)">
                <span class="choice-title" style="color:#4ade80;">Choice A: Apply for a subsidized independent living transitional housing voucher.</span>
                <span class="choice-desc">Lock down a tiny-home placement option that includes a stable mailing address. (+100 XP)</span>
            </button>
            <button class="choice-btn" onclick="selectHousingOption('B', 25)">
                <span class="choice-title" style="color:var(--warning);">Choice B: Accept an immediate couch-surfing offer from an unverified online acquaintance.</span>
                <span class="choice-desc">Bypass voucher wait times to focus entirely on hunting down land leads today. (+25 XP)</span>
            </button>
            <button class="choice-btn" onclick="selectHousingOption('C', 0)">
                <span class="choice-title" style="color:var(--danger);">Choice C: Pitch a stealth tent inside a public park parcel next to an irrigation canal.</span>
                <span class="choice-desc">Avoid administrative networks entirely to camp directly out beside water assets. (+0 XP)</span>
            </button>
        </div>
        <div id="feedback-viewport" class="feedback-box">
            <h3 id="feedback-title" style="margin-top:0;"></h3>
            <p id="feedback-text"></p>
            <div id="feedback-explanation" class="feedback-explanation"></div>
            <div id="feedback-action-container"></div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => { document.getElementById('global-points').innerText = localStorage.getItem('afti_global_xp') || '400'; });
    function selectHousingOption(choiceType, points) {
        let currentXP = (parseInt(localStorage.getItem('afti_global_xp') || '400', 10)) + points;
        localStorage.setItem('afti_global_xp', currentXP); document.getElementById('global-points').innerText = currentXP;
        document.getElementById('choices-wrapper').style.display = 'none';
        const vp = document.getElementById('feedback-viewport'); const title = document.getElementById('feedback-title');
        const text = document.getElementById('feedback-text'); const explanation = document.getElementById('feedback-explanation');
        const ac = document.getElementById('feedback-action-container'); vp.style.display = 'block';
        if (choiceType === 'A') {
            vp.style.background = 'rgba(39,174,96,0.1)'; vp.style.border = '1px solid rgba(39,174,96,0.4)'; title.innerText = "Success (+100 XP)"; title.style.color = "#4ade80";
            text.innerText = "Your voucher application is accepted. You move into a secure tiny home community with a locking door and a legal address for your files.";
            explanation.innerHTML = "<strong>Portfolio Evaluation:</strong> Superb operational resilience. You recognized that physiological safety is a prerequisite for agricultural development.";
            ac.innerHTML = '<a href="difficult-track-stage4-vocational.html" class="nav-bridge">Proceed to Stage 4: Vocational Preparation &rarr;</a>';
        } else if (choiceType === 'B') {
            vp.style.background = 'rgba(245,158,11,0.1)'; vp.style.border = '1px solid rgba(245,158,11,0.4)'; title.innerText = "Misinformed Pivot (+25 XP)"; title.style.color = "var(--warning)";
            text.innerText = "The landlord discovers your arrangement after three days and enforces a strict 'no unauthorized guests' policy. You are asked to leave with zero notice.";
            explanation.innerHTML = "<strong>Portfolio Evaluation:</strong> You prioritized rapid, informal land visibility over residential structure. Couch-surfing leaves your portfolio data unstable.";
            ac.innerHTML = '<a href="difficult-track-stage3-recovery-b.html" class="nav-bridge" style="background:var(--warning);">Enter Housing Recovery Loop &rarr;</a>';
        } else {
            vp.style.background = 'rgba(239,68,68,0.1)'; vp.style.border = '1px solid rgba(239,68,68,0.4)'; title.innerText = "Critical Risk (+0 XP)"; title.style.color = "var(--danger)";
            text.innerText = "Code enforcement sweeps the park area at dawn. Your campsite is cleared out, your tarp is confiscated, and you receive an official municipal trespass citation.";
            explanation.innerHTML = "<strong>Portfolio Evaluation:</strong> Operating entirely outside of local frameworks generates structural liabilities. Legal citations freeze your verified metric updates.";
            ac.innerHTML = '<a href="difficult-track-stage3-recovery-c.html" class="nav-bridge" style="background:var(--danger);">Enter Citation Resolution Recovery Loop &rarr;</a>';
        }
    }
</script>
</body>
</html>
