<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTI - Capital Recovery: Contract Risk</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --txt:#f8fafc; --primary:#27ae60; --hud:#144d29; --warn:#f59e0b; }
        body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .container { width:100%; max-width:800px; background:var(--card); border-radius:14px; padding:35px; border:1px solid rgba(255,255,255,0.1); }
        .hud-bar { background:var(--hud); border-radius:8px; padding:10px 18px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:0.9rem; }
        .task-label { background:#0f172a; padding:20px; border-radius:10px; border:1px solid #334155; display:flex; align-items:flex-start; gap:15px; cursor:pointer; margin-bottom:15px; }
        .task-cb { margin-top:4px; transform:scale(1.3); accent-color:var(--primary); }
        .bridge-box { background:rgba(39,174,96,0.1); border:1px solid rgba(39,174,96,0.4); padding:25px; border-radius:12px; text-align:center; display:none; }
    </style>
</head>
<body>
<div class="container">
    <div class="hud-bar">
        <span>Path: <span style="color:var(--warn);">Capital (Contract Recovery)</span></span>
        <div style="display:flex; align-items:center; gap:20px;"><div>XP: <span id="global-points" style="color:#4ade80;">425</span></div><button onclick="window.location.href='index.html'" style="background:#334155; color:#fff; border:1px solid rgba(255,255,255,0.2); padding:5px 12px; border-radius:6px; font-size:0.75rem; cursor:pointer;">🏠 Exit</button></div>
    </div>
    <div>
        <h2 style="margin:0 0 1.5rem 0; color:var(--warn);">⚠️ Risk Correction: Wholesale Contract Mitigation</h2>
        <p style="line-height:1.6; color:#cbd5e1; margin-bottom:25px;">Betting your entire field output on a single rigid retail quota triggered short-delivery fees after the spring frost. Check both boxes to balance your ledger options.</p>
        <div style="margin-bottom:25px;">
            <label class="task-label"><input type="checkbox" class="task-cb" onchange="checkProg(this, 50)"><div><strong>Negotiate Act of God/Force Majeure Contract Clauses (+50 XP)</strong><div style="color:#cbd5e1; font-size:0.9rem;">File official climate exemption papers with wholesale buyers to nullify weight penalties.</div></div></label>
            <label class="task-label"><input type="checkbox" class="task-cb" onchange="checkProg(this, 25)"><div><strong>Establish Independent Local Subscription Drop Points (+25 XP)</strong><div style="color:#cbd5e1; font-size:0.9rem;">Redirect surviving crop rows directly to regional restaurant accounts to rebuild immediate liquidity.</div></div></label>
        </div>
        <div id="bridge-panel" class="bridge-box">
            <h3 style="color:#4ade80; margin-top:0;">Contract Risk Cleared</h3>
            <button onclick="window.location.href='difficult-track-stage4-vocational.html'" style="background:var(--primary); color:#fff; font-weight:bold; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; margin-top:10px;">Proceed to Stage 4: Vocational Practicum &rarr;</button>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => { document.getElementById('global-points').innerText = localStorage.getItem('afti_global_xp') || '425'; });
    function checkProg(cb, points) {
        let currentXP = parseInt(localStorage.getItem('afti_global_xp') || '425', 10) + (cb.checked ? points : -points);
        localStorage.setItem('afti_global_xp', currentXP); document.getElementById('global-points').innerText = currentXP;
        const cbs = document.querySelectorAll('.task-cb'); const all = Array.from(cbs).every(c => c.checked);
        document.getElementById('bridge-panel').style.display = all ? 'block' : 'none';
    }
</script>
</body>
</html>
