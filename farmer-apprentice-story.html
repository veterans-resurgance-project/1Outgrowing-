<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Agrarian Gateway: Farmer &amp; Apprentice</title>
    <!-- LINK TO CORE UTILITY -->
    <script src="afti-core.js"></script>
    <style>
        :root { 
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-color: #f8fafc; 
            --primary: #27ae60; 
            --hud-bg: #144d29; 
            --accent: #38bdf8;
        }
        body { 
            font-family: system-ui, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            width: 100%; 
            max-width: 800px; 
            background: var(--card-bg); 
            border-radius: 14px; 
            padding: 35px; 
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }
        .hud-bar { 
            background: var(--hud-bg); 
            border-radius: 8px; 
            padding: 10px 18px; 
            margin-bottom: 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 0.9rem;
        }
        .story-image-slot { 
            width: 100%; 
            height: 220px; 
            background: #0f172a; 
            border-radius: 10px; 
            border: 1px solid rgba(56,189,248,0.3); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 25px; 
            color: #94a3b8;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            font-style: italic;
        }
        .prose-block {
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }
        .prose-block p {
            margin-bottom: 15px;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .choice-btn { 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #f8fafc; 
            padding: 16px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            text-align: left; 
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.2s ease;
        }
        .choice-btn:hover { 
            border-color: var(--primary); 
            background: rgba(39, 174, 96, 0.1); 
            transform: translateY(-2px);
        }
        .choice-title {
            font-weight: bold;
            color: #4ade80;
            font-size: 1.05rem;
        }
        .choice-desc {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- GLOBAL HUD -->
    <div class="hud-bar">
        <span>Path: <span id="hud-track" style="color: var(--accent);">Not Selected</span></span>
        <div>
            <span>Global XP: <span id="global-points" style="color: #4ade80;">400</span></span>
        </div>
    </div>

    <!-- DYNAMIC STORY VIEWPORT -->
    <div id="story-viewport">
        <!-- Injected via JavaScript -->
    </div>
</div>

<!-- ALL LOGIC PROPERLY LOCKED INSIDE THE SCRIPT TAG -->
<script>
    // Story Node Graph Data
    const storyNodes = {
        intro: {
            image: "🌲 [Illustration: Early morning mist rising over a diverse Willamette Valley homestead]",
            title: "Roots &amp; Resilience: The Agrarian Gateway",
            prose: `
                <p>The soil of the valley has a long memory. For generations, people have come to this land seeking roots, sustainability, and a fresh start. Our protagonist stands at a crossroads, staring out over a neglected plot of earth bordered by towering Douglas-firs and wild berry thickets.</p>
                <p>The dream is simple: build a regenerative homestead, master the craft of the land, and carve out an independent living. But how you get your footing changes everything. Every path demands grit, but the resources—and the hurdles—look vastly different depending on where you start.</p>
                <p><em>Choose your background to begin your journey:</em></p>
            `,
            choices: [
                {
                    title: "The Foster-Alum Route (High Resilience, Scrappy Start)",
                    desc: "You just turned 18. Left out in the streets with a single bag holding your meager belongings, it's almost dark, cold, and the city lights are blurring. You possess unmatched adaptability and a deep instinct for survival.",
                    action: "selectTrack('foster', 'Foster-Alum Track', 'foster_start')"
                },
                {
                    title: "The Standard Bootstrap Route (Balanced Grind)",
                    desc: "You’ve scraped together a small savings account from off-farm labor. Balancing a day job while slowly buying tools, learning extension guidelines, and trying to secure a long-term lease.",
                    action: "selectTrack('standard', 'Standard Bootstrap', 'standard_start')"
                },
                {
                    title: "The Capital-Backed Route (Privileged Backing)",
                    desc: "Family support or early investments have provided you with land access and startup capital. The challenge isn't survival—it's avoiding over-capitalization and earning local respect.",
                    action: "selectTrack('capital', 'Capital-Backed Track', 'capital_start')"
                }
            ]
        },

        foster_start: {
            image: "🌆 [Illustration: Cold, dim city street corner at dusk with heavy shadows and distant neon signs]",
            title: "The Turning Point: Day Zero",
            prose: `
                <p>The heavy institutional glass doors close behind you for the last time. You just turned 18. You're standing out on the concrete sidewalk as a damp Pacific Northwest chill sets into the evening air, holding a single canvas bag with your meager belongings.</p>
                <p>It's almost dark, the temperature is dropping fast, and the city feels vast, indifferent, and expensive. You have no safety net, no family couch to crash on, and only a few crumpled bills in your pocket.</p>
                <p>You need to make a move before night fully takes over. What do you do?</p>
            `,
            choices: [
                {
                    title: "Option A: Head toward the public transit hub to find a 24-hour shelter or mutual aid network",
                    desc: "Connect with local community resources, safeguard your belongings, and look for immediate transitional housing support. (+50 XP)",
                    action: "resolveChoice('foster_shelter', 50, 'Shelter & Mutual Aid Network Located')"
                },
                {
                    title: "Option B: Walk toward the edge of town where the industrial grid meets the agricultural valley",
                    desc: "Scout out an abandoned tool shed or sheltered perimeter near public lands to set up a temporary camp under your tarp. (+50 XP)",
                    action: "resolveChoice('foster_outskirts', 50, 'Perimeter Scouted & Camp Established')"
                }
            ]
        }
    };

    let currentTrack = "";

    document.addEventListener("DOMContentLoaded", () => {
        // Load the initial intro screen
        renderNode("intro");
        
        // Sync up global points from localStorage
        const pointsDisplay = document.getElementById('global-points');
        if (pointsDisplay) {
            pointsDisplay.innerText = localStorage.getItem('afti_global_xp') || '400';
        }
    });

    function selectTrack(trackId, trackName, nextNodeId) {
        currentTrack = trackId;
        localStorage.setItem('afti_active_track', trackId);
        localStorage.setItem('afti_track_name', trackName);
        
        const trackHUD = document.getElementById('hud-track');
        if (trackHUD) {
            trackHUD.innerText = trackName;
        }
        
        // Move to the next scenario step smoothly
        renderNode(nextNodeId);
    }

    function resolveChoice(choiceId, xpAmount, feedbackMessage) {
        // Update local storage values cleanly
        let currentXP = parseInt(localStorage.getItem('afti_global_xp') || '400', 10);
        currentXP += xpAmount;
        localStorage.setItem('afti_global_xp', currentXP);
        
        const pointsDisplay = document.getElementById('global-points');
        if (pointsDisplay) {
            pointsDisplay.innerText = currentXP;
        }

        // Hide choice buttons immediately to prevent duplicate tracking clicks
        const choicesWrapper = document.getElementById('choices-wrapper');
        if (choicesWrapper) {
            choicesWrapper.style.display = 'none';
        }

        // Inject our clear course bridge container layout
        const storyViewport = document.getElementById('story-viewport');
        const feedbackBox = document.createElement('div');
        feedbackBox.style.marginTop = '25px';
        feedbackBox.style.padding = '25px';
        feedbackBox.style.borderRadius = '10px';
        feedbackBox.style.background = 'rgba(39, 174, 96, 0.1)';
        feedbackBox.style.border = '1px solid rgba(39, 174, 96, 0.4)';
