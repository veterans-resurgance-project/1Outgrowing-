<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTI - Track Selector</title>
    <style>
        :root { --bg-color:#0f172a; --card-bg:#1e293b; --text-color:#f8fafc; --primary:#27ae60; --hud-bg:#144d29; --accent:#38bdf8; }
        body { font-family:system-ui, sans-serif; background:var(--bg-color); color:var(--text-color); padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .container { width:100%; max-width:800px; background:var(--card-bg); border-radius:14px; padding:35px; box-sizing:border-box; border:1px solid rgba(255,255,255,0.1); }
        .hud-bar { background:var(--hud-bg); border-radius:8px; padding:10px 18px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:0.9rem; }
        .choices-container { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
        .choice-btn { background:#0f172a; border:1px solid #334155; color:#f8fafc; padding:16px 20px; border-radius:8px; cursor:pointer; width:100%; text-align:left; display:flex; flex-direction:column; gap:5px; }
        .choice-btn:hover { border-color:var(--primary); background:rgba(39,174,96,0.1); }
        .choice-title { font-weight:bold; color:#4ade80; font-size:1.05rem; }
        .choice-desc { font-size:0.85rem; color:#94a3b8; }
    </style>
</head>
<body>
<div class="container">
    <div class="hud-bar">
        <span>Path: <span id="hud-track" style="color:var(--accent);">Not Selected</span></span>
        <div style="display:flex; align-items:center; gap:20px;">
            <div>Global XP: <span id="global-points" style="color:#4ade80;">400</span></div>
            <button onclick="window.location.href='index.html'" style="background:#334155; color:#fff; border:1px solid rgba(255,255,255,0.2); padding:5px 12px; border-radius:6px; font-size:0.75rem; cursor:pointer;">🏠 Exit</button>
        </div>
    </div>
    <div>
        <h2 style="margin-top:0;">🌾 Select Your Background Track</h2>
        <p style="line-height:1.6; color:#cbd5e1;">Every path demands grit, but your initial hurdles change depending on where you start. Select a track to initialize your portfolio tracking data:</p>
        
        <div class="choices-container">
            <!-- FOSTER ALUM PATH -->
            <button class="choice-btn" onclick="localStorage.setItem('afti_track_name','Foster-Alum'); window.location.href='difficult-track-stage2-daycenter.html'">
                <span class="choice-title">1. The Foster-Alum Route (High Resilience, Scrappy Start)</span>
                <span class="choice-desc">Navigate systemic resource gaps, secure clean cell documentation, and build vital social capital networks.</span>
            </button>
            
            <!-- STANDARD BOOTSTRAP PATH -->
            <button class="choice-btn" onclick="localStorage.setItem('afti_track_name','Standard Bootstrap'); window.location.href='standard-track-stage1-waiting.html'">
                <span class="choice-title">2. The Standard Bootstrap Route (Balanced Grind)</span>
                <span class="choice-desc">Balance an off-farm day job while researching local university extension data and preparing soil on waiting lists.</span>
            </button>
            
            <!-- CAPITAL BACKED PATH -->
            <button class="choice-btn" onclick="localStorage.setItem('afti_track_name','Capital-Backed'); window.location.href='capital-track-stage1-finance.html'">
                <span class="choice-title">3. The Capital-Backed Route (High Investment Focus)</span>
                <span class="choice-desc">Manage upfront commercial funds, outline machinery cashflow parameters, and protect yourself against debt traps.</span>
            </button>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => { 
        document.getElementById('global-points').innerText = localStorage.getItem('afti_global_xp') || '400'; 
    });
</script>
</body>
</html>
